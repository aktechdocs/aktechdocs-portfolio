<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Platform Release Notes | AKTechDocs</title>
  <meta name="description" content="Production release notes, changelog, and migration guidance sample by AKTechDocs." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --sidebar-bg: #111827;
      --card-bg: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --tag-feature: #10b981;
      --tag-fix: #3b82f6;
      --tag-breaking: #ef4444;
      --tag-deprecate: #f59e0b;
      --code-bg: #030712;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Sidebar Navigation */
    aside {
      width: 280px;
      min-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    aside .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: opacity 0.2s;
    }
    aside .back-link:hover { opacity: 0.8; }

    aside .brand {
      font-weight: 700;
      font-size: 1.15rem;
      display: block;
      margin-bottom: 1.5rem;
      color: var(--text);
      text-decoration: none;
    }
    aside .brand span { color: var(--accent); }

    aside nav h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 1.5rem 0 0.5rem;
    }

    aside nav a {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.4rem 0;
      transition: color 0.2s ease;
    }
    aside nav a:hover { color: #fff; }

    /* Main Content */
    main {
      flex: 1;
      max-width: 900px;
      padding: 3.5rem 3rem;
      overflow-y: auto;
    }

    header.doc-header {
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.25rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .lead {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    /* Release Section Blocks */
    .release-block {
      border-bottom: 1px solid var(--border);
      padding-bottom: 3rem;
      margin-bottom: 3rem;
      scroll-margin-top: 2rem;
    }

    .release-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .version-title {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .release-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      background: var(--card-bg);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .release-meta {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 2rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .release-meta strong { color: var(--text); }

    h3 {
      font-size: 1.15rem;
      margin: 1.75rem 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* Badges */
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tag-breaking { background: var(--tag-breaking); }
    .tag-feature { background: var(--tag-feature); }
    .tag-fix { background: var(--tag-fix); }
    .tag-deprecate { background: var(--tag-deprecate); }

    /* Lists */
    ul.item-list {
      list-style: none;
      padding-left: 0;
      margin-bottom: 1.5rem;
    }
    ul.item-list li {
      margin-bottom: 0.85rem;
      padding-left: 1.25rem;
      position: relative;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    ul.item-list li::before {
      content: "•";
      color: var(--accent);
      position: absolute;
      left: 0;
      font-size: 1.25rem;
      line-height: 1;
    }
    ul.item-list li strong { color: var(--text); }

    /* Callouts */
    .callout {
      border-left: 4px solid var(--tag-breaking);
      background: rgba(239, 68, 68, 0.08);
      border-radius: 0 6px 6px 0;
      padding: 0.9rem 1.2rem;
      margin: 1rem 0 1.25rem;
      font-size: 0.9rem;
      color: #fca5a5;
    }
    .callout strong { color: #fecaca; }

    /* Code Blocks */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      margin: 0.6rem 0 0.85rem;
      overflow-x: auto;
    }
    code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.88em;
    }

    /* Compatibility Matrix Section */
    #compatibility {
      scroll-margin-top: 2rem;
      margin-top: 2rem;
    }
    #compatibility h2 {
