<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Platform Release Notes | AKTechDocs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --sidebar-bg: #1e293b;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --tag-feature: #10b981;
      --tag-fix: #3b82f6;
      --tag-breaking: #ef4444;
      --tag-deprecate: #f59e0b;
      --code-bg: #090d16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      line-height: 1.6;
    }
    aside {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    aside .brand {
      font-weight: 700;
      font-size: 1.1rem;
      display: block;
      margin-bottom: 2rem;
      color: var(--text);
      text-decoration: none;
    }
    aside .brand span { color: var(--accent); }
    aside nav h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 1.25rem 0 0.5rem;
    }
    aside nav a {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0;
      transition: color 0.2s;
    }
    aside nav a:hover { color: var(--accent); }
    aside .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
    }
    main {
      flex: 1;
      max-width: 900px;
      padding: 3rem 2.5rem;
      overflow-y: auto;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .lead { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 2.5rem; }
    .release-block {
      border-bottom: 1px solid var(--border);
      padding-bottom: 3rem;
      margin-bottom: 3rem;
    }
    .release-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .version-title { font-size: 1.6rem; font-weight: 700; }
    .release-date { font-size: 0.9rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .release-meta {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .release-meta strong { color: var(--text); }
    h3 {
      font-size: 1.15rem;
      margin: 1.75rem 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      color: #fff;
    }
    .tag-feature { background: var(--tag-feature); }
    .tag-breaking { background: var(--tag-breaking); }
    .tag-fix { background: var(--tag-fix); }
    .tag-deprecate { background: var(--tag-deprecate); }

    ul.item-list {
      list-style: none;
      padding-left: 0;
      margin-bottom: 1.5rem;
    }
    ul.item-list li {
      margin-bottom: 0.85rem;
      padding-left: 1.25rem;
      position: relative;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    ul.item-list li::before {
      content: "•";
      color: var(--accent);
      position: absolute;
      left: 0;
      font-size: 1.2rem;
      line-height: 1;
    }
    ul.item-list li strong { color: var(--text); }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      margin: 0.5rem 0 1rem;
      overflow-x: auto;
    }
    code { font-family: 'JetBrains Mono', monospace; color: var(--accent); }
    .callout {
      border-left: 4px solid var(--tag-breaking);
      background: rgba(239, 68, 68, 0.1);
      padding: 1rem;
      border-radius: 0 6px 6px 0;
      margin: 1rem 0;
      font-size: 0.9rem;
      color: #fca5a5;
    }
  </style>
</head>

    </nav>
  </aside>
