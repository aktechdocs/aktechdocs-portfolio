<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKTechDocs | Enterprise Technical Writing & API Documentation</title>
  <meta name="description" content="Senior Technical Writer specializing in REST APIs, enterprise software manuals, DITA XML, and developer documentation." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      border-bottom: 1px solid var(--surface-border);
      background: rgba(15, 23, 42, 0.9);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .container { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; }
    
    /* Hero */
    .hero { padding: 4rem 1.5rem 3rem; text-align: left; }
    .hero h1 { font-size: 2.75rem; line-height: 1.2; margin-bottom: 1rem; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 1.2rem; color: var(--text-muted); max-width: 720px; margin-bottom: 1.75rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.95rem;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text);
      margin-left: 0.75rem;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* Sections & Cards */
    section { padding: 3rem 0; border-top: 1px solid var(--surface-border); }
    h2 { font-size: 1.85rem; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #fff; }
    .card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1rem; flex-grow: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: #0f172a;
      border: 1px solid var(--surface-border);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }
    .card-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .card-link:hover { text-decoration: underline; }

    /* Skills Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }
    .skill-category {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 1.25rem;
      border-radius: 6px;
    }
    .skill-category h4 { color: var(--accent); margin-bottom: 0.75rem; font-size: 1rem; }
    .skill-category ul { list-style: none; font-size: 0.9rem; color: var(--text-muted); }
    .skill-category li { margin-bottom: 0.4rem; }

    /* Contact Section */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 3rem 2rem;
      text-align: center;
      max-width: 820px;
      margin: 0 auto;
    }
    .contact-card h3 { font-size: 1.75rem; margin-bottom: 0.75rem; color: #fff; }
    .contact-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem; }

    /* Clipboard Email Action */
    .email-container {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #0f172a;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 0.4rem 0.5rem 0.4rem 1.2rem;
      margin-bottom: 2rem;
    }
    .email-text {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .copy-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: var(--primary-dark); }
    .copy-btn.copied {
      background: var(--success);
    }

    /* Contact Grid Details */
    .contact-channels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
      padding-top: 2rem;
      border-top: 1px solid var(--surface-border);
    }
    .channel-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }
    .channel-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .channel-link {
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .channel-link:hover { text-decoration: underline; }

    footer {
      border-top: 1px solid var(--surface-border);
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
